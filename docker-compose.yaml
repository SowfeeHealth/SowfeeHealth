services:
  db:
    image: pgvector/pgvector:pg16
    container_name: my-postgres-container
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "3307:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    image: ${DOCKER_USERNAME:-local}/django-app:latest
    container_name: django-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IS_DOCKER_DEV=true
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    command: bash -c "python manage.py makemigrations tenants accounts surveys chat && python manage.py migrate_schemas && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 core.asgi:application"

  celery:
    build: .
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      - redis
      - db
    working_dir: /app  # Add this line

volumes:
  postgres_data:
  redis_data:
